[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgtime-py"
version = "0.1.0"
description = "Python SDK for pgtime temporal tables extension"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "psycopg2-binary>=2.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pgtime*"]
